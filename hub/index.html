<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services</title>
<style>
/*
 * colors.css: a drop-in colour system for a generated HTML page.
 *
 * Copy this into a <style> block (or link it) and the page has a full palette,
 * a dark and a light mode, and the five variables the dark/light toggle in
 * conventions/html-output.md expects. Dark is the default, per that rule.
 *
 * HOW IT IS PUT TOGETHER: two layers, and the split is the whole point:
 *
 *   Layer 0   the ramps. Raw colour, every family 50 -> 950. Nothing outside
 *             this file's Layer 1 should ever name a ramp step directly.
 *   Layer 1   the slots. --bg, --text, --brand, --ok-soft and friends. This is
 *             what your markup uses. Both modes set the same slot names to
 *             different ramp steps, which is why the toggle is one class flip
 *             and not a second stylesheet.
 *
 * TO REBRAND: change the hue numbers in Layer 0 and stop. Every slot, both
 * modes, and every element follow, because nothing downstream hardcodes a
 * colour. That is the property worth protecting: the moment a page writes
 * `color: #4a9` somewhere, dark mode has a hole in it.
 *
 * The hues here are deliberate placeholders (brand 250, accent 190), not any
 * real product's identity. Swap them.
 *
 * Ramps are OKLCH: oklch(lightness chroma hue). Lightness falls evenly down the
 * ramp; chroma peaks around 500 and eases off both ends, which is what keeps a
 * 50 from looking muddy and a 950 from looking neon.
 */

/* ── Layer 0: ramps (never name these in your markup) ─────────────────── */
:root {
  /* neutral: chrome, text, borders, surfaces */
  --p-neutral-50: oklch(0.985 0.002 255);
  --p-neutral-100: oklch(0.96 0.004 255);
  --p-neutral-200: oklch(0.92 0.006 255);
  --p-neutral-300: oklch(0.86 0.01 255);
  --p-neutral-400: oklch(0.7 0.018 255);
  --p-neutral-500: oklch(0.55 0.025 255);
  --p-neutral-600: oklch(0.45 0.028 255);
  --p-neutral-700: oklch(0.37 0.03 255);
  --p-neutral-800: oklch(0.29 0.028 255);
  --p-neutral-900: oklch(0.22 0.022 255);
  --p-neutral-950: oklch(0.15 0.016 255);

  /* brand: the one colour a reader should associate with the page */
  --p-brand-50: oklch(0.97 0.02 250);
  --p-brand-100: oklch(0.94 0.04 250);
  --p-brand-200: oklch(0.88 0.07 250);
  --p-brand-300: oklch(0.81 0.1 250);
  --p-brand-400: oklch(0.72 0.13 250);
  --p-brand-500: oklch(0.63 0.15 250);
  --p-brand-600: oklch(0.55 0.145 250);
  --p-brand-700: oklch(0.47 0.125 251);
  --p-brand-800: oklch(0.4 0.1 251);
  --p-brand-900: oklch(0.33 0.078 252);
  --p-brand-950: oklch(0.25 0.05 252);

  /* accent: a second voice, for highlights the brand shouldn't claim */
  --p-accent-50: oklch(0.97 0.02 190);
  --p-accent-100: oklch(0.94 0.042 190);
  --p-accent-200: oklch(0.89 0.068 190);
  --p-accent-300: oklch(0.83 0.092 190);
  --p-accent-400: oklch(0.75 0.108 190);
  --p-accent-500: oklch(0.66 0.115 191);
  --p-accent-600: oklch(0.57 0.108 192);
  --p-accent-700: oklch(0.48 0.092 193);
  --p-accent-800: oklch(0.4 0.076 193);
  --p-accent-900: oklch(0.33 0.058 194);
  --p-accent-950: oklch(0.25 0.04 194);

  /* success */
  --p-success-50: oklch(0.97 0.02 150);
  --p-success-100: oklch(0.94 0.045 150);
  --p-success-200: oklch(0.88 0.072 150);
  --p-success-300: oklch(0.81 0.1 150);
  --p-success-400: oklch(0.72 0.118 150);
  --p-success-500: oklch(0.63 0.13 150);
  --p-success-600: oklch(0.55 0.12 150);
  --p-success-700: oklch(0.47 0.104 150);
  --p-success-800: oklch(0.4 0.086 150);
  --p-success-900: oklch(0.33 0.068 150);
  --p-success-950: oklch(0.25 0.045 150);

  /* warning */
  --p-warning-50: oklch(0.98 0.025 85);
  --p-warning-100: oklch(0.95 0.055 85);
  --p-warning-200: oklch(0.91 0.09 83);
  --p-warning-300: oklch(0.86 0.125 81);
  --p-warning-400: oklch(0.81 0.148 78);
  --p-warning-500: oklch(0.76 0.155 75);
  --p-warning-600: oklch(0.67 0.142 70);
  --p-warning-700: oklch(0.58 0.125 65);
  --p-warning-800: oklch(0.49 0.105 60);
  --p-warning-900: oklch(0.41 0.085 55);
  --p-warning-950: oklch(0.32 0.06 50);

  /* danger */
  --p-danger-50: oklch(0.97 0.018 25);
  --p-danger-100: oklch(0.93 0.04 25);
  --p-danger-200: oklch(0.87 0.08 25);
  --p-danger-300: oklch(0.8 0.12 25);
  --p-danger-400: oklch(0.73 0.165 26);
  --p-danger-500: oklch(0.65 0.2 27);
  --p-danger-600: oklch(0.58 0.195 27);
  --p-danger-700: oklch(0.5 0.175 27);
  --p-danger-800: oklch(0.43 0.15 27);
  --p-danger-900: oklch(0.36 0.12 27);
  --p-danger-950: oklch(0.28 0.085 27);

  /* info */
  --p-info-50: oklch(0.97 0.018 230);
  --p-info-100: oklch(0.94 0.04 230);
  --p-info-200: oklch(0.88 0.065 230);
  --p-info-300: oklch(0.81 0.09 230);
  --p-info-400: oklch(0.72 0.11 230);
  --p-info-500: oklch(0.63 0.125 230);
  --p-info-600: oklch(0.55 0.115 230);
  --p-info-700: oklch(0.47 0.1 230);
  --p-info-800: oklch(0.4 0.082 230);
  --p-info-900: oklch(0.33 0.065 230);
  --p-info-950: oklch(0.25 0.045 230);
}

/* ── Layer 1: slots, dark (the default) ───────────────────────────────── */
:root {
  /* The five the toggle in html-output.md depends on. Keep these names. */
  --bg: var(--p-neutral-950);
  --surface: var(--p-neutral-900);
  --text: var(--p-neutral-100);
  --dim: var(--p-neutral-400);
  --border: var(--p-neutral-800);

  /* Room to build with: a raised surface for cards on cards, and two quieter
     text tiers, so hierarchy comes from the palette instead of from opacity. */
  --surface-2: var(--p-neutral-800);
  --text-2: var(--p-neutral-300);
  --text-3: var(--p-neutral-500);

  --brand: var(--p-brand-400);
  --brand-content: var(--p-neutral-950);
  --brand-hover: var(--p-brand-300);
  --accent: var(--p-accent-400);
  --accent-content: var(--p-neutral-950);

  /* Status comes in pairs: -soft backs a pill or a row tint, -line is the ink
     or rule that sits on it. Using them together is what keeps a status
     readable in both modes without a per-mode override at the callsite. */
  --ok-soft: oklch(0.28 0.05 150);
  --ok-line: var(--p-success-300);
  --warn-soft: oklch(0.3 0.06 75);
  --warn-line: var(--p-warning-300);
  --err-soft: oklch(0.29 0.06 27);
  --err-line: var(--p-danger-300);
  --info-soft: oklch(0.28 0.05 230);
  --info-line: var(--p-info-300);

  --shadow-sm: 0 2px 5px -1px oklch(0 0 0 / 0.45), 0 1px 2px -1px oklch(0 0 0 / 0.4);
  --shadow-md: 0 8px 18px -4px oklch(0 0 0 / 0.55), 0 3px 6px -3px oklch(0 0 0 / 0.4);
  --shadow-lg: 0 22px 44px -10px oklch(0 0 0 / 0.65), 0 8px 16px -8px oklch(0 0 0 / 0.45);

  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 1rem;

  color-scheme: dark;
}

/* ── Layer 1: slots, light ────────────────────────────────────────────── */
/* `body.light` is the toggle's contract (html-output.md). The [data-theme]
   selector is here too so this file also works on pages that theme from the
   root element; drop whichever one your page doesn't use. */
body.light,
:root[data-theme="light"] {
  --bg: var(--p-neutral-50);
  --surface: oklch(1 0 0);
  --text: var(--p-neutral-900);
  --dim: var(--p-neutral-500);
  --border: var(--p-neutral-200);

  --surface-2: var(--p-neutral-100);
  --text-2: var(--p-neutral-700);
  --text-3: var(--p-neutral-500);

  /* A step deeper than dark's brand: filled controls read light text here, and
     the airy 400 that works on a near-black page cannot hold white. */
  --brand: var(--p-brand-600);
  --brand-content: oklch(1 0 0);
  --brand-hover: var(--p-brand-700);
  --accent: var(--p-accent-600);
  --accent-content: oklch(1 0 0);

  --ok-soft: var(--p-success-100);
  --ok-line: var(--p-success-700);
  /* 900, not 700: the mid warning ink drops under 4.5:1 on its own soft tint at
     pill sizes. Warning is the one family where the obvious pairing fails. */
  --warn-soft: var(--p-warning-100);
  --warn-line: var(--p-warning-900);
  --err-soft: var(--p-danger-100);
  --err-line: var(--p-danger-700);
  --info-soft: var(--p-info-100);
  --info-line: var(--p-info-700);

  --shadow-sm: 0 2px 4px -1px oklch(0.3 0.02 255 / 0.12), 0 1px 2px -1px oklch(0.3 0.02 255 / 0.1);
  --shadow-md: 0 6px 14px -3px oklch(0.3 0.02 255 / 0.18), 0 3px 6px -3px oklch(0.3 0.02 255 / 0.12);
  --shadow-lg: 0 18px 36px -8px oklch(0.3 0.02 255 / 0.26), 0 6px 12px -6px oklch(0.3 0.02 255 / 0.14);

  color-scheme: light;
}

/* A floor to build on, so a page that just includes this file already reads
   correctly in both modes instead of inheriting the browser's white. */
body {
  background: var(--bg);
  color: var(--text);
}

/* The shared look for every HTML page an agent builds: reports, previews, decision
   pages, shared Artifacts. Colours come from conventions/html-assets/colors.css, which
   pagekit.py inlines above this file. Nothing here names a colour directly, so a theme
   change is one edit in colors.css. Guide: conventions/pages.md */

:root {
  --kit-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --kit-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --kit-width: 1100px;
  --kit-measure: 74ch;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 96px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--kit-sans); }

/* The bar stays on top. Table headers stop just under it. */
.kit-bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.kit-bar-inner { max-width: var(--kit-width); margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.kit-title { font: 600 17px/1.2 var(--kit-sans); margin: 0; margin-right: auto; }
.kit-theme { font: 500 12.5px var(--kit-sans); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.kit-theme:focus-visible, .kit-tab:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.kit-tabs { display: flex; flex-wrap: wrap; gap: 5px; max-width: var(--kit-width); margin: 0 auto; padding: 0 16px 10px; }
.kit-tab { font: 500 12.5px var(--kit-sans); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.kit-tab[aria-selected="true"] { color: var(--brand-content); background: var(--brand); border-color: var(--brand); }

.kit-page { max-width: var(--kit-width); margin: 0 auto; padding: 28px 16px 80px; }
.kit-page h1 { font: 600 30px/1.15 var(--kit-sans); margin: 0 0 14px; text-wrap: balance; }
.kit-page h2 { font: 600 20px/1.25 var(--kit-sans); margin: 40px 0 12px; text-wrap: balance; }
.kit-page h3 { font: 600 16px/1.3 var(--kit-sans); margin: 28px 0 8px; }
.kit-page h4 { font: 600 14px/1.3 var(--kit-sans); margin: 20px 0 6px; }
.kit-page p, .kit-page li { max-width: var(--kit-measure); }
.kit-page p { margin: 0 0 12px; }
.kit-page ul, .kit-page ol { padding-left: 22px; margin: 0 0 14px; }
.kit-page li { margin: 5px 0; }
.kit-page a { color: var(--brand); }
.kit-page code { font: 13px var(--kit-mono); background: var(--surface-2); padding: 1px 5px; border-radius: var(--radius-sm); }
.kit-page pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px; overflow-x: auto; font: 13px/1.45 var(--kit-mono); }
.kit-page pre code { background: none; padding: 0; }
.kit-dim { color: var(--dim); }

/* Tables. pagekit.size_columns sets each column's width from what it holds. */
.kit-table-wrap { overflow-x: auto; }
.kit-page table { border-collapse: collapse; width: 100%; margin: 14px 0 20px; font-size: 14px; table-layout: fixed; }
.kit-page table.kit-wide { min-width: 1400px; }
.kit-page th, .kit-page td { overflow-wrap: anywhere; vertical-align: top; text-align: left; }
.kit-page thead { position: relative; z-index: 2; }
.kit-page thead th { font: 600 11px var(--kit-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 8px 10px; border-bottom: 2px solid var(--border); background: var(--bg); }
.kit-page thead.kit-stuck th { background: var(--surface); box-shadow: 0 1px 0 var(--border), var(--shadow-sm); }
.kit-page td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
.kit-page td:first-child { font-weight: 500; }
.kit-page tr:hover td { background: var(--surface-2); }
.kit-page td p { margin: 0 0 4px; max-width: none; }
.kit-page td ul { margin: 0; padding-left: 16px; }
.kit-page td li { margin: 2px 0; max-width: none; }

/* Labelled lists that sit side by side, for things a reader compares. */
.kit-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin: 12px 0 22px; align-items: start; }
.kit-col { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px 8px; }
.kit-col.kit-good { border-top-color: var(--ok-line); }
.kit-col.kit-warn { border-top-color: var(--warn-line); }
.kit-col.kit-bad { border-top-color: var(--err-line); }
.kit-col > h4 { font: 600 11px var(--kit-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
.kit-col ul { margin: 0; padding-left: 18px; }
.kit-col li { max-width: none; font-size: 14px; margin: 4px 0; }

/* A card of key and value pairs, for what a page is and who it is for. */
.kit-card { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; padding: 14px 18px; margin: 0 0 24px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--brand); border-radius: var(--radius-md); font-size: 14px; }
.kit-card > .k { font: 600 11px var(--kit-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding-top: 3px; }

/* The one sentence a reader must not miss. */
.kit-key { margin: 16px 0; padding: 12px 18px; border-left: 3px solid var(--brand); background: var(--surface-2); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
.kit-key p { margin: 0; max-width: none; }

/* Status notes. Use the word as well as the colour. */
.kit-note { margin: 14px 0; padding: 10px 14px; border: 1px solid var(--border); border-left-width: 3px; border-radius: var(--radius-md); background: var(--surface); }
.kit-note.kit-good { border-left-color: var(--ok-line); background: var(--ok-soft); }
.kit-note.kit-warn { border-left-color: var(--warn-line); background: var(--warn-soft); }
.kit-note.kit-bad { border-left-color: var(--err-line); background: var(--err-soft); }
.kit-note.kit-info { border-left-color: var(--info-line); background: var(--info-soft); }
.kit-note p { margin: 0; max-width: none; }

.kit-chip { display: inline-block; font: 500 11.5px var(--kit-mono); padding: 0 6px; border-radius: var(--radius-sm); line-height: 18px; background: var(--surface-2); border: 1px solid var(--border); }

[hidden] { display: none !important; }
@media (max-width: 640px) { .kit-page h1 { font-size: 24px; } .kit-card { grid-template-columns: 1fr; } }
@media print { .kit-bar, .kit-theme { display: none; } body { background: #fff; color: #000; } }

/* The services page. Colours come only from the shared kit's variables. Text steps
   most between sizes and controls least, so a control grows without looking swollen. */
:root {
  --t: 1;
  --c: 1;
  --fs-body: calc(14px * var(--t));
  --fs-small: calc(13px * var(--t));
  --fs-head: calc(17px * var(--t));
  --fs-code: calc(12px * var(--t));
  --control: calc(30px * var(--c));
  --gap: calc(12px * var(--c));
}
:root[data-size="md"] { --t: 1.18; --c: 1.11; }
:root[data-size="lg"] { --t: 1.36; --c: 1.22; }

.kit-page { padding-top: 24px; font-size: var(--fs-body); }

/* Size switch, beside the theme switch */
.hub-sizes { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: 999px; }
.hub-sizes button {
  font: 500 12px var(--kit-sans); color: var(--dim); background: none; border: 0;
  border-radius: 999px; padding: 3px 9px; cursor: pointer;
}
.hub-sizes button:hover { color: var(--text); }
.hub-sizes button[aria-pressed="true"] { color: var(--text); background: var(--surface-2); }

/* Search leads the page, because finding a service is the first thing done here */
.hub-find { position: relative; display: block; }
.hub-search {
  width: 100%; height: calc(44px * var(--c)); padding: 0 44px 0 14px;
  font: var(--fs-head) var(--kit-sans); color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
}
.hub-search::-webkit-search-cancel-button { display: none; }
.hub-search::placeholder { color: var(--dim); }
.hub-find kbd {
  position: absolute; top: 50%; right: 12px; transform: translateY(-50%); pointer-events: none;
  font: 12px var(--kit-mono); color: var(--dim); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1px 7px;
}
.hub-search:not(:placeholder-shown) + kbd { display: none; }
.kit-page p.hub-notice { margin: 14px 0 0; max-width: none; color: var(--dim); font-size: var(--fs-small); }

/* Groups */
.hub-group { margin-top: calc(28px * var(--c)); }
.kit-page h2.hub-head {
  display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px;
  font: 600 var(--fs-head) var(--kit-sans);
}
.hub-count { font: 400 var(--fs-small) var(--kit-sans); color: var(--dim); font-variant-numeric: tabular-nums; }
.kit-page ul.hub-list { list-style: none; margin: 0; padding: 0; }
.hub-empty { margin: 8px 0 0; color: var(--dim); font-size: var(--fs-small); }

/* A service. The columns line up down the whole page, in every group. */
.kit-page li.hub-row {
  display: grid; align-items: center; column-gap: 16px; margin: 0; max-width: none;
  grid-template-columns: 14px minmax(0, 1fr) calc(52px * var(--t)) calc(190px * var(--t)) calc(130px * var(--t)) calc(150px * var(--t));
  min-height: calc(46px * var(--c)); padding: 7px 8px;
  border-top: 1px solid var(--border);
}
.kit-page li.hub-row:first-child { border-top: 0; }
.hub-row:hover, .hub-row:focus-within { background: var(--surface); }
.hub-row[aria-busy="true"] { opacity: 0.6; }

.hub-dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text-3); }
.hub-dot.on { background: var(--ok-line); border-color: var(--ok-line); }
.hub-dot.bad { background: var(--err-line); border-color: var(--err-line); }
.hub-dot.changing { border-color: var(--warn-line); }

.hub-who { min-width: 0; }
.kit-page a.hub-name, .hub-name {
  font-weight: 600; font-size: var(--fs-body); color: var(--text); text-decoration: none; overflow-wrap: anywhere;
}
.kit-page a.hub-name[href]:hover { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; }
.hub-note { color: var(--dim); font-size: var(--fs-small); overflow-wrap: anywhere; }
.kit-page code.hub-cmd {
  display: block; margin-top: 2px; padding: 0; background: none;
  font: var(--fs-code) var(--kit-mono); color: var(--dim); overflow-wrap: anywhere;
}
.hub-port { font: var(--fs-small) var(--kit-mono); color: var(--dim); font-variant-numeric: tabular-nums; }

.hub-status { color: var(--dim); font-size: var(--fs-small); }
/* How long is left before this service stops unused: full when just used, empty at
   its limit. This bar is the page's one bold element. */
.hub-meter { height: 4px; margin-top: 5px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.hub-meter i { display: block; height: 100%; background: var(--ok-line); transform-origin: left; transition: transform 0.4s ease; }
.hub-meter.low i { background: var(--warn-line); }

/* Controls */
.hub-limit, .hub-go, .hub-stop {
  height: var(--control); font: 500 var(--fs-small) var(--kit-sans); border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap;
}
.hub-limit {
  width: 100%; padding: 0 8px; text-align: left; color: var(--dim);
  background: none; border: 1px solid transparent;
}
.hub-limit.own { color: var(--text); }
.hub-limit::after { content: " ▾"; color: var(--text-3); }
.hub-row:hover .hub-limit, .hub-limit:focus-visible, .hub-limit[aria-expanded="true"] { border-color: var(--border); }
.hub-limit:hover { background: var(--surface-2); }

.hub-actions { display: flex; justify-content: flex-end; gap: 6px; }
.kit-page a.hub-go, .hub-go {
  display: inline-flex; align-items: center; padding: 0 12px; text-decoration: none;
  color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
}
.kit-page a.hub-go:hover { color: var(--brand-content); background: var(--brand); border-color: var(--brand); }
.hub-stop { padding: 0 10px; color: var(--dim); background: none; border: 1px solid transparent; }
.hub-stop:hover { color: var(--text); background: var(--surface-2); }
.hub-stop:disabled { cursor: default; }

:is(.hub-search, .hub-limit, .hub-go, .hub-stop, .hub-name, .hub-sizes button, .hub-menu button, .hub-minutes, summary):focus-visible {
  outline: 2px solid var(--brand); outline-offset: 1px;
}

/* Older services */
.hub-fold > summary {
  display: flex; align-items: baseline; gap: 8px; cursor: pointer; list-style: none;
  font: 600 var(--fs-head) var(--kit-sans);
}
.hub-fold > summary::-webkit-details-marker { display: none; }
.hub-fold > summary::before { content: "▸"; color: var(--dim); }
.hub-fold[open] > summary::before { content: "▾"; }
.hub-fold .hub-fold { margin-top: 18px; }
.hub-fold .hub-fold > summary { font-size: var(--fs-body); }
.kit-page p.hub-why { margin: 6px 0 8px; color: var(--dim); font-size: var(--fs-small); }

/* The idle limit menu, one shared by every row */
.hub-menu {
  position: fixed; inset: auto; margin: 0; width: calc(190px * var(--c)); padding: 4px;
  color: var(--text); background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
}
.hub-menu button {
  display: block; width: 100%; padding: 5px 10px; text-align: left; cursor: pointer;
  font: var(--fs-small) var(--kit-sans); color: var(--text); background: none; border: 0; border-radius: var(--radius-sm);
}
.hub-menu button:hover, .hub-menu button:focus-visible { background: var(--surface-2); }
.hub-menu button[aria-checked="true"]::before { content: "✓ "; color: var(--brand); }
.hub-minutes {
  display: block; width: 100%; height: var(--control); margin-top: 4px; padding: 0 10px;
  font: var(--fs-small) var(--kit-sans); color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}

/* Messages sit in one corner, so nothing on the page moves when one arrives */
.hub-toast {
  position: fixed; left: 16px; bottom: 16px; z-index: 20; display: flex; align-items: center; gap: 12px;
  max-width: min(520px, calc(100vw - 32px)); padding: 10px 14px;
  font-size: var(--fs-small); color: var(--text); background: var(--surface);
  border: 1px solid var(--border); border-left: 3px solid var(--ok-line);
  border-radius: var(--radius-md); box-shadow: var(--shadow-md);
}
.hub-toast.bad { border-left-color: var(--err-line); }
.hub-toast button {
  flex: none; padding: 0; font: 500 var(--fs-small) var(--kit-sans); color: var(--brand);
  background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}

.kit-page p.hub-keys { margin: calc(28px * var(--c)) 0 0; color: var(--dim); font-size: var(--fs-small); }
.hub-keys kbd { font: var(--fs-code) var(--kit-mono); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 5px; }

/* While the first read is on its way */
.hub-skeleton { height: 12px; border-radius: 6px; background: var(--surface-2); }
.hub-go-page { font-size: var(--fs-head); }

@media (max-width: 860px) {
  .kit-page li.hub-row { grid-template-columns: 14px minmax(0, 1fr) 150px 170px; row-gap: 2px; }
  .hub-port { display: none; }
  .hub-state { grid-column: 2; grid-row: 2; }
  .hub-limit-cell { grid-column: 3; grid-row: 1 / span 2; }
  .hub-actions { grid-column: 4; grid-row: 1 / span 2; }
}
@media (max-width: 560px) {
  .kit-page li.hub-row { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .hub-limit-cell { grid-column: 2; grid-row: 3; }
  .hub-limit { width: auto; padding-left: 0; }
  .hub-actions { grid-column: 3; grid-row: 1 / span 3; flex-direction: column; align-items: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .hub-meter i { transition: none; }
}

</style>
</head>
<body>
<header class="kit-bar"><div class="kit-bar-inner"><h1 class="kit-title">Services</h1><button type="button" class="kit-theme" data-kit-theme>Light</button></div></header>
<main class="kit-page">

</main>
<script>
// Behaviour every page shares: the theme switch, tables that scroll inside
// their own box, table headers that follow the reader, and plain tabs.
// Inlined into a page by pagekit.py. Guide: conventions/pages.md
(function () {
  const root = document.documentElement;

  // Theme. Dark is the default; the choice is remembered when the browser allows it.
  function readTheme() { try { return localStorage.getItem('kit-theme'); } catch (e) { return null; } }
  function applyTheme(t) {
    root.dataset.theme = t;
    document.body.classList.toggle('light', t === 'light');
    document.querySelectorAll('[data-kit-theme]').forEach(b => { b.textContent = t === 'light' ? 'Dark' : 'Light'; b.setAttribute('aria-label', 'Switch to ' + (t === 'light' ? 'dark' : 'light') + ' theme'); });
  }
  applyTheme(readTheme() || root.dataset.theme || 'dark');
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-kit-theme]'); if (!b) return;
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    applyTheme(next);
    try { localStorage.setItem('kit-theme', next); } catch (err) {}
  });

  // Every table scrolls sideways inside its own box, never the whole page.
  document.querySelectorAll('.kit-page table').forEach(t => {
    if (t.parentElement.classList.contains('kit-table-wrap')) return;
    const w = document.createElement('div'); w.className = 'kit-table-wrap';
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  // Table headers follow the reader. CSS sticky cannot do this, because a
  // header cannot stick past the scroll box its table sits in.
  const bar = document.querySelector('.kit-bar');
  let queued = false;
  function stick() {
    queued = false;
    const top = bar ? bar.getBoundingClientRect().bottom : 0;
    document.querySelectorAll('.kit-page table').forEach(t => {
      const h = t.tHead; if (!h || t.offsetParent === null) return;
      const box = t.getBoundingClientRect();
      const dy = (box.top < top && box.bottom - h.offsetHeight - 40 > top) ? Math.round(top - box.top) : 0;
      h.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
      h.classList.toggle('kit-stuck', dy > 0);
    });
  }
  function queue() { if (!queued) { queued = true; requestAnimationFrame(stick); } }
  window.addEventListener('scroll', queue, { passive: true });
  window.addEventListener('resize', queue);

  // Tabs. A button with data-kit-tab="x" shows the element with data-kit-panel="x".
  const tabs = Array.from(document.querySelectorAll('[data-kit-tab]'));
  function show(name) {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t.dataset.kitTab === name)));
    document.querySelectorAll('[data-kit-panel]').forEach(p => { p.hidden = p.dataset.kitPanel !== name; });
    window.scrollTo(0, 0); queue();
  }
  tabs.forEach(t => t.addEventListener('click', () => { show(t.dataset.kitTab); try { history.replaceState(null, '', '#' + t.dataset.kitTab); } catch (e) {} }));
  if (tabs.length) {
    const wanted = (location.hash || '').slice(1);
    show(tabs.some(t => t.dataset.kitTab === wanted) ? wanted : tabs[0].dataset.kitTab);
  }
})();

// The services page: find a service, open it, and see how long it has left before it
// stops unused. Rows are kept and updated in place, so a status refresh never takes
// away focus, scroll position or an open menu. Opening /go/<name> in a tab starts that
// service and then moves the tab to it, so a slow start never hits a pop-up blocker,
// and the address works as a bookmark.

const main = document.querySelector('.kit-page');
const POLL_MS = 5000;
const LIMITS = [5, 15, 30, 60, 120, 240, 480, 720, 1440];
const TAB_REPORT_STALE_MIN = 10;
const REAP_EVERY_MIN = 5;
const TOAST_MS = 8000;
const LOW_METER = 0.2;

let data = null;
let query = '';
let pastOpen = false;
let stuckOpen = false;
let readFailed = false;
const busy = new Map();
const rows = new Map();

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) el.append(kid);
  }
  return el;
}

function setText(el, text) {
  if (el.textContent !== text) el.textContent = text;
}

function duration(min) {
  if (min < 60) return `${min} min`;
  const hours = Math.floor(min / 60);
  const rest = min % 60;
  const head = `${hours} hour${hours === 1 ? '' : 's'}`;
  return rest ? `${head} ${rest} min` : head;
}

function shortDuration(min) {
  if (min < 1) return 'moments';
  if (min < 60) return `${min}m`;
  if (min < 48 * 60) return `${Math.floor(min / 60)}h ${min % 60}m`.replace(/ 0m$/, '');
  return `${Math.floor(min / 1440)}d`;
}

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const answer = await res.json().catch(() => ({ ok: false, error: 'The hub did not answer' }));
  if (!res.ok || answer.ok === false) throw new Error(answer.error || 'That did not work');
  return answer;
}

// ---- messages ----

const toast = h('div', { class: 'hub-toast', role: 'status', hidden: true });
let toastTimer = null;

function hideToast() {
  clearTimeout(toastTimer);
  toast.hidden = true;
}

// A success fades on its own. A failure stays until dismissed, so looking away
// cannot lose it.
function say(text, { bad = false, action = null } = {}) {
  clearTimeout(toastTimer);
  toast.className = `hub-toast${bad ? ' bad' : ''}`;
  toast.setAttribute('role', bad ? 'alert' : 'status');
  toast.replaceChildren(...[h('span', {}, text),
    action && h('button', { type: 'button', onclick: () => { hideToast(); action.run(); } }, action.label),
    bad && h('button', { type: 'button', onclick: hideToast }, 'Dismiss')].filter(Boolean));
  toast.hidden = false;
  if (!bad) toastTimer = setTimeout(hideToast, TOAST_MS);
}

async function act(name, busyLabel, fn, success) {
  busy.set(name, busyLabel);
  update();
  try {
    await fn();
    if (success) say(success.text, success);
  } catch (err) {
    say(err.message, { bad: true });
  }
  busy.delete(name);
  await refresh();
}

// ---- what a row says ----

function statusText(s) {
  if (busy.has(s.name)) return busy.get(s.name);
  if (s.kind === 'past') {
    if (s.outsidePm2) return 'Port in use outside pm2, may be this service';
    return s.cannotStart || (s.guessed ? 'Command guessed from package.json, may not work' : 'Last command on record');
  }
  if (s.name === data.self) return 'This page, always on';
  if (s.failed) return 'Crashed';
  if (s.changing) return 'Changing state…';
  // Its section heading already says so, unless a search has mixed the sections.
  if (!s.running) return '';
  if (s.booting) return 'Starting up…';
  if (s.noPort) return 'Running with no port, so it never auto-stops';
  if (s.heldUntil) return `Held for ${shortDuration(Math.round((s.heldUntil * 1000 - Date.now()) / 60000))} more`;
  if (s.limit.mode === 'keep') return `Used ${shortDuration(s.idleMin)} ago`;
  const left = s.limit.minutes - s.idleMin;
  return left > 0 ? `Stops within ${shortDuration(left + REAP_EVERY_MIN)} if unused` : `Stops within ${REAP_EVERY_MIN}m`;
}

/** The share of the idle limit still left, or null when this service has no countdown. */
function timeLeft(s) {
  if (s.kind !== 'pm2' || !s.running || s.noPort || s.heldUntil || s.limit.mode === 'keep') return null;
  return Math.max(0, Math.min(1, 1 - s.idleMin / s.limit.minutes));
}

function limitText(s) {
  if (s.limit.mode === 'keep') return 'Never stops';
  if (s.limit.mode === 'idle') return `${duration(s.limit.minutes)} idle`;
  return `Default, ${duration(s.limit.minutes)}`;
}

function openLabel(s) {
  if (s.name === data.self || s.changing) return null;
  if (s.kind === 'past') {
    if (s.outsidePm2) return 'Open';
    if (!s.cmd) return null;
    return s.guessed ? 'Try to start' : 'Start and open';
  }
  if (s.running) return s.listening ? 'Open' : null;
  return 'Start and open';
}

// ---- rows ----

function createRow(name) {
  const parts = {
    dot: h('span', { class: 'hub-dot', 'aria-hidden': 'true' }),
    name: h('a', { class: 'hub-name', target: '_blank', rel: 'noopener' }, name),
    note: h('div', { class: 'hub-note', hidden: true }),
    cmd: h('code', { class: 'hub-cmd', hidden: true }),
    port: h('span', { class: 'hub-port' }),
    status: h('div', { class: 'hub-status' }),
    meterFill: h('i', {}),
    limit: h('button', { class: 'hub-limit', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', hidden: true }),
    go: h('a', { class: 'hub-go', target: '_blank', rel: 'noopener', hidden: true }),
    stop: h('button', { class: 'hub-stop', type: 'button', hidden: true }, 'Stop'),
  };
  parts.meter = h('div', { class: 'hub-meter', 'aria-hidden': 'true', hidden: true }, parts.meterFill);
  parts.el = h('li', { class: 'hub-row', 'data-service': name },
    parts.dot,
    h('div', { class: 'hub-who' }, parts.name, parts.note, parts.cmd),
    parts.port,
    h('div', { class: 'hub-state' }, parts.status, parts.meter),
    h('div', { class: 'hub-limit-cell' }, parts.limit),
    h('div', { class: 'hub-actions' }, parts.go, parts.stop));
  const href = `/go/${encodeURIComponent(name)}`;
  parts.href = href;
  parts.limit.addEventListener('click', () => openMenu(name, parts.limit));
  parts.stop.addEventListener('click', () => act(name, 'Stopping…', () => post('/api/stop', { name }), {
    text: `Stopped ${name}`,
    action: { label: 'Start again', run: () => act(name, 'Starting…', () => post('/api/up', { name })) },
  }));
  return parts;
}

function updateRow(p, s) {
  const isBusy = busy.has(s.name);
  const label = openLabel(s);
  p.el.setAttribute('aria-busy', String(isBusy));
  p.dot.className = `hub-dot${s.failed ? ' bad' : s.running ? ' on' : s.changing ? ' changing' : ''}`;
  if (label && !isBusy) p.name.setAttribute('href', p.href);
  else p.name.removeAttribute('href');

  setText(p.note, s.note || '');
  p.note.hidden = !s.note;
  setText(p.cmd, s.kind === 'past' && s.cmd ? s.cmd : '');
  p.cmd.hidden = !(s.kind === 'past' && s.cmd);
  if (s.cwd) p.cmd.title = `In ${s.cwd}`;
  setText(p.port, s.port ? `:${s.port}` : '');
  setText(p.status, statusText(s));

  const left = timeLeft(s);
  p.meter.hidden = left === null;
  if (left !== null) {
    p.meterFill.style.transform = `scaleX(${left})`;
    p.meter.classList.toggle('low', left < LOW_METER);
  }

  const canTune = s.kind === 'pm2' && s.name !== data.self && !s.noPort;
  p.limit.hidden = !canTune;
  if (canTune) {
    setText(p.limit, limitText(s));
    p.limit.classList.toggle('own', s.limit.mode !== 'default');
    p.limit.setAttribute('aria-label', `Idle limit for ${s.name}: ${limitText(s)}. Change`);
  }

  p.go.hidden = !label || isBusy;
  if (label) {
    p.go.setAttribute('href', p.href);
    setText(p.go, label);
  }
  p.stop.hidden = !(s.kind === 'pm2' && s.running && s.name !== data.self && !s.changing);
  p.stop.disabled = isBusy;
}

// Puts exactly these services in this list, in this order, moving a row only when it
// has to, because moving the row that holds focus would drop that focus.
function fillList(list, services) {
  let cursor = list.firstElementChild;
  for (const s of services) {
    let p = rows.get(s.name);
    if (!p) {
      p = createRow(s.name);
      rows.set(s.name, p);
    }
    updateRow(p, s);
    if (p.el === cursor) {
      cursor = cursor.nextElementSibling;
    } else {
      const refocus = p.el.contains(document.activeElement) ? document.activeElement : null;
      list.insertBefore(p.el, cursor);
      refocus?.focus();
    }
  }
  while (cursor) {
    const next = cursor.nextElementSibling;
    cursor.remove();
    cursor = next;
  }
}

// ---- the idle limit menu ----

const menu = h('div', { class: 'hub-menu', popover: 'auto', role: 'menu', 'aria-label': 'Idle limit' });
let menuAnchor = null;

function setLimit(name, body, text) {
  const back = menuAnchor;
  menu.hidePopover();
  back?.focus();
  act(name, 'Saving…', () => post('/api/limit', { name, ...body }), { text });
}

function openMenu(name, anchor) {
  const s = data.services.find((x) => x.name === name);
  const minutes = new Set(LIMITS);
  if (s.limit.mode === 'idle') minutes.add(s.limit.minutes);
  const item = (label, checked, run) => h('button', { type: 'button', role: 'menuitemradio', 'aria-checked': String(checked), onclick: run }, label);
  const defaultMin = s.limit.mode === 'default' ? s.limit.minutes : data.defaultLimitMin;

  const custom = h('input', {
    class: 'hub-minutes', type: 'number', min: 1, max: 10080, placeholder: 'Other, in minutes', 'aria-label': `Idle limit for ${name}, in minutes`,
    onkeydown: (e) => {
      if (e.key !== 'Enter') return;
      const value = Number(e.target.value);
      setLimit(name, { mode: 'idle', minutes: value }, `${name} now stops after ${duration(value)} unused`);
    },
  });

  menu.replaceChildren(
    item(`Default, ${duration(defaultMin)}`, s.limit.mode === 'default', () => setLimit(name, { mode: 'default' }, `${name} is back on the default limit`)),
    ...[...minutes].sort((a, b) => a - b).map((m) => item(duration(m), s.limit.mode === 'idle' && s.limit.minutes === m,
      () => setLimit(name, { mode: 'idle', minutes: m }, `${name} now stops after ${duration(m)} unused`))),
    item('Never stop', s.limit.mode === 'keep', () => setLimit(name, { mode: 'keep' }, `${name} will not auto-stop`)),
    custom);

  menuAnchor = anchor;
  anchor.setAttribute('aria-expanded', 'true');
  menu.showPopover();
  const box = anchor.getBoundingClientRect();
  const size = menu.getBoundingClientRect();
  const below = box.bottom + 4 + size.height <= innerHeight;
  menu.style.top = `${below ? box.bottom + 4 : Math.max(8, box.top - 4 - size.height)}px`;
  menu.style.left = `${Math.max(8, Math.min(box.left, innerWidth - size.width - 8))}px`;
  (menu.querySelector('[aria-checked="true"]') || menu.querySelector('button')).focus();
}

menu.addEventListener('toggle', (e) => {
  if (e.newState === 'closed' && menuAnchor) {
    menuAnchor.setAttribute('aria-expanded', 'false');
    menuAnchor.focus();
    menuAnchor = null;
  }
});

menu.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const items = [...menu.querySelectorAll('button, input')];
  const at = items.indexOf(document.activeElement);
  items[(at + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
});

// ---- the page ----

const search = h('input', {
  class: 'hub-search', type: 'search', placeholder: 'Find a service', 'aria-label': 'Find a service', autocomplete: 'off', spellcheck: 'false',
  oninput: (e) => { query = e.target.value; update(); },
  onkeydown: (e) => {
    if (e.key === 'Escape') { search.value = ''; query = ''; update(); }
    if (e.key === 'Enter') main.querySelector('.hub-go:not([hidden])')?.click();
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
  },
});
const notice = h('p', { class: 'hub-notice', hidden: true });

function group(title) {
  const count = h('span', { class: 'hub-count' });
  const list = h('ul', { class: 'hub-list' });
  const empty = h('p', { class: 'hub-empty', hidden: true });
  const el = h('section', { class: 'hub-group', 'aria-label': title }, h('h2', { class: 'hub-head' }, title, count), list, empty);
  return { el, count, list, empty };
}

const runningGroup = group('Running');
const stoppedGroup = group('Stopped');

const startableList = h('ul', { class: 'hub-list' });
const stuckList = h('ul', { class: 'hub-list' });
const stuckCount = h('span', { class: 'hub-count' });
const pastCount = h('span', { class: 'hub-count' });
const stuckFold = h('details', { class: 'hub-fold' }, h('summary', {}, 'No way to start', stuckCount), stuckList);
const pastFold = h('details', { class: 'hub-fold' },
  h('summary', {}, 'Older services', pastCount),
  h('p', { class: 'hub-why' }, 'Servers the port ledger remembers. Starting one runs the command shown, under pm2, and it stays listed above. It auto-stops once it opens a port.'),
  startableList, stuckFold);
const noMatch = h('p', { class: 'hub-empty', hidden: true });

pastFold.addEventListener('toggle', () => { if (!query.trim()) { pastOpen = pastFold.open; update(); } });
stuckFold.addEventListener('toggle', () => { if (!query.trim()) { stuckOpen = stuckFold.open; update(); } });

function update() {
  if (!data) return;
  const q = query.trim().toLowerCase();
  const all = data.services.filter((s) => !q || `${s.name} ${s.note} ${s.port ?? ''} ${s.cwd ?? ''}`.toLowerCase().includes(q));
  const managed = all.filter((s) => s.kind === 'pm2');
  const past = all.filter((s) => s.kind === 'past');
  const running = managed.filter((s) => s.running || s.changing).concat(past.filter((s) => s.outsidePm2));
  const stopped = managed.filter((s) => !s.running && !s.changing);
  const startable = past.filter((s) => !s.outsidePm2 && s.cmd);
  const stuck = past.filter((s) => !s.outsidePm2 && !s.cmd);

  const fill = (g, services, emptyText) => {
    fillList(g.list, services);
    setText(g.count, String(services.length));
    g.el.hidden = Boolean(q) && !services.length;
    g.empty.hidden = services.length > 0;
    setText(g.empty, emptyText);
  };
  fill(runningGroup, running, 'Nothing is running.');
  fill(stoppedGroup, stopped, running.length ? 'Everything pm2 knows is running.' : 'pm2 knows no services yet. Anything you add to pm2 appears here by itself.');

  // Older rows run to the hundreds, so they only exist while their section is open.
  const showPast = pastOpen || Boolean(q);
  const showStuck = stuckOpen || Boolean(q);
  pastFold.open = showPast;
  stuckFold.open = showStuck;
  setText(pastCount, String(startable.length + stuck.length));
  setText(stuckCount, String(stuck.length));
  fillList(startableList, showPast ? startable : []);
  fillList(stuckList, showPast && showStuck ? stuck : []);
  stuckFold.hidden = !stuck.length;
  pastFold.parentElement.hidden = Boolean(q) && !startable.length && !stuck.length;

  noMatch.hidden = !q || all.length > 0;
  setText(noMatch, `No service matches “${query.trim()}”. Search covers names, notes, ports and folders.`);

  // A machine-wide fact, said once, and only while it can cost something.
  const stale = data.tabReportAgeMin === null || data.tabReportAgeMin > TAB_REPORT_STALE_MIN;
  const atRisk = data.services.some((s) => timeLeft(s) !== null);
  let line = '';
  if (readFailed) line = 'The hub could not read your services just now. Showing the last known state, and trying again.';
  else if (stale && atRisk) line = 'Reload the bfb extension. Until then, open tabs do not count as use, so a service can stop while you read it.';
  setText(notice, line);
  notice.hidden = !line;
}

async function refresh() {
  try {
    const res = await fetch('/api/services');
    const answer = await res.json();
    if (!res.ok) throw new Error(answer.error);
    data = answer;
    readFailed = false;
    showPage();
    update();
  } catch (err) {
    readFailed = true;
    if (data) update();
    else main.replaceChildren(h('p', { role: 'alert' }, `The hub could not read your services: ${err.message || 'no answer'}. Trying again.`));
  }
}

let pageShown = false;

function showPage() {
  if (pageShown) return;
  pageShown = true;
  main.replaceChildren(
    h('label', { class: 'hub-find' }, search, h('kbd', { 'aria-hidden': 'true' }, '/')),
    notice, noMatch, runningGroup.el, stoppedGroup.el,
    h('section', { class: 'hub-group', 'aria-label': 'Older services' }, pastFold),
    h('p', { class: 'hub-keys' }, 'Keys: ', h('kbd', {}, '/'), ' find, ', h('kbd', {}, 'j'), ' and ', h('kbd', {}, 'k'), ' move, ', h('kbd', {}, 'Enter'), ' opens'));
}

function moveFocus(step) {
  const links = [...main.querySelectorAll('a.hub-name[href]')].filter((a) => a.offsetParent !== null);
  if (!links.length) return;
  const at = links.indexOf(document.activeElement);
  if (at === -1) { links[step > 0 ? 0 : links.length - 1].focus(); return; }
  const next = at + step;
  if (next < 0) search.focus();
  else links[Math.min(next, links.length - 1)].focus();
}

// Keys for people who keep their hands on the keyboard: / finds, j and k move.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || !pageShown) return;
  if (e.target.matches('input, select, textarea') || e.target.closest('.hub-menu')) return;
  if (e.key === '/') { e.preventDefault(); search.focus(); search.select(); }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); }
  if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveFocus(-1); }
});

// ---- text size, one setting for the whole page ----

function readSize() {
  try { return localStorage.getItem('hub-size') || 'sm'; } catch { return 'sm'; }
}

function setSize(size) {
  document.documentElement.dataset.size = size;
  try { localStorage.setItem('hub-size', size); } catch { /* private window: the choice lasts this visit */ }
  sizes.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === size)));
}

const sizes = h('div', { class: 'hub-sizes', role: 'group', 'aria-label': 'Text size' },
  [['sm', 'Small'], ['md', 'Medium'], ['lg', 'Large']].map(([size, label]) =>
    h('button', { type: 'button', 'data-size': size, 'aria-label': label, 'aria-pressed': 'false', onclick: () => setSize(size) }, size.toUpperCase().slice(0, 1))));
document.querySelector('.kit-theme').before(sizes);
setSize(readSize());
document.body.append(toast, menu);

// ---- starting up ----

async function goTo(name) {
  document.title = `Starting ${name}`;
  main.replaceChildren(h('p', { class: 'hub-go-page', role: 'status' }, `Starting ${name}…`));
  try {
    const answer = await post('/api/up', { name });
    if (answer.url && answer.note) {
      main.replaceChildren(h('p', { role: 'status' }, answer.note), h('p', {}, h('a', { href: answer.url }, `Open port ${new URL(answer.url).port} anyway`)));
      return;
    }
    if (answer.url) { location.replace(answer.url); return; }
    throw new Error(answer.error || `${name} started, but it has no page to open`);
  } catch (err) {
    document.title = `${name} did not open`;
    main.replaceChildren(h('p', { role: 'alert' }, err.message), h('p', {}, h('a', { href: '/' }, 'Back to all services')));
  }
}

const going = /^\/go\/(.+)$/.exec(location.pathname);
if (going) {
  goTo(decodeURIComponent(going[1]));
} else {
  main.replaceChildren(h('div', { role: 'status', 'aria-label': 'Reading your services' },
    ...[1, 2, 3, 4].map(() => h('div', { class: 'hub-skeleton', style: 'margin: 18px 0' }))));
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
}

</script>
</body>
</html>
